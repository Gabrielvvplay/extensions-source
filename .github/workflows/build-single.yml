name: Build Single Extension

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Mangas Brasuka APK
        run: ./gradlew :src:pt:mangasbrasuka:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mangas-brasuka-apk
          path: '**/*.apk'
